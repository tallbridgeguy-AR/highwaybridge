<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>

    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: sans-serif;
      }

      model-viewer {
        width: 100%;
        height: 100%;
        background-color: #fcfcfc;
      }

      /* Container for all UI overlays */
      .controls-container {
        position: absolute;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        z-index: 999;
      }

      /* Common button styling */
      .custom-button {
        background-color: #4285f4;
        color: white;
        border-radius: 10px;
        border: none;
        padding: 15px 30px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      }

      #ar-button {
        padding: 20px 40px;
        font-size: 22px;
      }

      /* Zoom button specific styling */
      .zoom-controls {
        display: flex;
        gap: 10px;
      }
      
      .zoom-btn {
        width: 50px;
        height: 50px;
        padding: 0;
        font-size: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
</head>
<body>

    <model-viewer 
        id="bridge-viewer"
        src="highwaybridge2.glb" 
        ios-src="highwaybridge2.usdz"
        ar 
        ar-modes="quick-look webxr scene-viewer" 
        camera-controls 
        shadow-intensity="1"
        autoplay> 
        
        <div class="controls-container">
            <div class="zoom-controls">
                <button type="button" class="custom-button zoom-btn" id="zoom-in">+</button>
                <button type="button" class="custom-button zoom-btn" id="zoom-out">−</button>
            </div>

            <button slot="ar-button" id="ar-button" class="custom-button">
                👋 VIEW IN AR
            </button>
        </div>
    </model-viewer>

    <script>
        const modelViewer = document.querySelector("#bridge-viewer");
        const zoomInBtn = document.querySelector("#zoom-in");
        const zoomOutBtn = document.querySelector("#zoom-out");

        // Zoom In
        zoomInBtn.addEventListener('click', () => {
            // "zoom(1)" moves the camera closer
            modelViewer.zoom(1);
        });

        // Zoom Out
        zoomOutBtn.addEventListener('click', () => {
            // "zoom(-1)" moves the camera further away
            modelViewer.zoom(-1);
        });
    </script>

</body>
</html>
